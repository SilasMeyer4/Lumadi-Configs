name: Build and Package Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: lumadi_config_linux.tar.gz
          - os: windows-latest
            artifact_name: lumadi_config_windows.zip
          - os: macos-latest
            artifact_name: lumadi_config_mac.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- COMPILER & TOOLS SETUP ---
      - name: Setup Linux Environment
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Setup Windows (MSYS2 / MinGW UCRT)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Setup macOS Environment
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      # --- BUILD ---
      - name: Configure and Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Lumadi_Configs

      - name: Configure and Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Lumadi_Configs

      # --- ARTIFACT PACKAGING ---
      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          mkdir -p package/include
          find build -name "libLumadi_Configs.a" -exec cp {} package/ \; 2>/dev/null || true
          find build -name "*.ifc" -o -name "*.gcm" -o -name "*.pcm" -exec cp {} package/include/ \; 2>/dev/null || true
          tar -a -c -f ${{ matrix.artifact_name }} -C package .

      - name: Package Artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p package/include
          find build -name "libLumadi_Configs.a" -exec cp {} package/ \; 2>/dev/null || true
          find build -name "*.ifc" -o -name "*.gcm" -o -name "*.pcm" -exec cp {} package/include/ \; 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }} -C package .

      # --- UPLOAD TO GITHUB RELEASE ---
      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}